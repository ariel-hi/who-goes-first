name: October 25 Google indexing checkpoint

on:
  schedule:
    - cron: '0 16 25 10 *' # October 25, 09:00 America/Los_Angeles (2026)
  workflow_dispatch:
    inputs:
      publish_report:
        description: Publish this verification run to the checkpoint issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-indexing-checkpoint-oct25
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Limit the scheduled run to October 25, 2026 in Pacific time
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(TZ=America/Los_Angeles date +%F)" == "2026-10-25" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'true'
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
        if: steps.due.outputs.run == 'true'
      - name: Authenticate to Search Console with existing keyless access
        id: google
        if: steps.due.outputs.run == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
      - name: Inspect all three pages and their live technical status
        if: steps.due.outputs.run == 'true'
        run: npx tsx scripts/indexing-checkpoint.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Retain fresh inspection evidence
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-checkpoint-${{ github.run_id }}
          path: artifacts/indexing-checkpoint/
          retention-days: 90
          if-no-files-found: warn
      - name: Notify the owner through the checkpoint issue
        if: always() && !cancelled() && steps.due.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.publish_report)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const scheduled = context.eventName === 'schedule';
            const marker = `<!-- google-indexing-checkpoint-2026-10-25:${scheduled ? 'scheduled' : 'verification'} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportFile = 'artifacts/indexing-checkpoint/report.md';
            const report = fs.existsSync(reportFile) ? fs.readFileSync(reportFile, 'utf8') :
              'Inspection could not complete. The indexing status of all three pages is **unknown**. Review the linked workflow failure; this is not evidence that the pages are excluded.';
            const intro = scheduled ? 'October 25 scheduled checkpoint result.' :
              'Manual cloud verification only; this is not the October 25 scheduled result. The configured checkpoint is October 25, 2026 at 09:00 Pacific (16:00 UTC).';
            const body = `${marker}\n\n@ariel-hi ${intro}\n\n${report}\n\n[Workflow and retained evidence](${runUrl})\n\nThe check runs on GitHub-hosted servers with the computer off. It checks CATAN, Wingspan and Burgundy without requesting indexing or changing the site.`;
            const issue = (await github.rest.issues.get({ ...context.repo, issue_number: 27 })).data;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            }
            await core.summary.addLink('Checkpoint result and notification', issue.html_url).write();
