name: Pinterest drip
on:
  schedule:
    - cron: '7 13 * * *' # release the day's queued Pins (13:07 UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinterest-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Verify reviewed scene artwork before releasing
        run: npm run pinterest:preview
      # The feed is static, so a commit is what makes Cloudflare Pages rebuild
      # it with today's Pins. No [skip ci]: Pages must build. Pushes made with
      # GITHUB_TOKEN do not start the CI workflow.
      - name: Record today's Pins
        run: |
          npx tsx scripts/release-pins.ts
          git add research/pinterest
          if git diff --cached --quiet; then echo "No Pins due today."; exit 0; fi
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Release today's Pinterest Pins"
          git pull --rebase
          git push
