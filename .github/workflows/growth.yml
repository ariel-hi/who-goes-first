name: Growth automation
# Schedules run from the default branch. The publisher requires credentials;
# optional reporting jobs skip cleanly when Google access is not configured.
on:
  schedule:
    - cron: '17 15 * * *' # daily discovery campaign (15:17 UTC)
    - cron: '41 6 * * 1,4' # search opportunities + report (Mondays and Thursdays)
    - cron: '29 11 * * *' # daily Search Console indexing upkeep
    - cron: '7 16 * * 1' # weekly indexing graduation (Mondays)
  workflow_dispatch:
    inputs:
      task:
        description: Which job to run
        type: choice
        options: [post, weekly, indexing, graduate, visitors]
        default: weekly
      inspection_budget:
        description: URL inspections for the indexing job (1–1600; scheduled runs use 150)
        type: number
        default: 150
concurrency:
  group: growth-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post:
    if: github.event.schedule == '17 15 * * *' || inputs.task == 'post'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/post-rule.ts
  weekly:
    if: github.event.schedule == '41 6 * * 1,4' || inputs.task == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'https://whogoesfirst.fun/' }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      # Keyless: GitHub's OIDC token is exchanged for a one-hour Google token.
      # Google only trusts this repository (Workload Identity attribute condition).
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - run: npx tsx scripts/growth-weekly.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      # Runs even when the report step fails, so a broken data feed raises an alert.
      - id: health
        if: always()
        run: npx tsx scripts/search-health.ts
      # One open issue labelled search-health carries alerts; GitHub notifies the owner.
      - name: Raise or resolve the search health issue
        if: always() && steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: ${{ steps.health.outputs.alerts }}
        run: |
          gh label create search-health --color B60205 --description "Automated search health alerts" 2>/dev/null || true
          open=$(gh issue list --label search-health --state open --json number --jq '.[0].number')
          if [ "${ALERTS:-0}" -gt 0 ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body-file research/demand/search-health.md
            else gh issue create --title "Search health needs attention" --label search-health --body-file research/demand/search-health.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Resolved: the latest weekly check found no alerts."
          fi
      # research/ never deploys; [skip ci] keeps this data commit from
      # triggering a site build on Cloudflare Pages or the CI workflow.
      - name: Commit research queue
        run: |
          git add research/demand
          if git diff --cached --quiet; then echo "No demand changes."; exit 0; fi
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update search demand research queue [skip ci]"
          git pull --rebase
          git push
  indexing:
    if: github.event.schedule == '29 11 * * *' || inputs.task == 'indexing'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'https://whogoesfirst.fun/' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      INSPECTION_BUDGET: ${{ inputs.inspection_budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      # Full webmasters scope so the job can submit missing sitemaps.
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false
      - run: npx tsx scripts/indexing-daily.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Commit indexing coverage
        if: always()
        run: |
          git add research/demand
          if git diff --cached --quiet; then echo "No indexing changes."; exit 0; fi
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update indexing coverage [skip ci]"
          git pull --rebase
          git push
  graduate:
    if: github.event.schedule == '7 16 * * 1' || inputs.task == 'graduate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/indexing-graduate.ts
      - run: npx vitest run tests/unit/indexing-policy.test.ts --testTimeout=60000
      # No [skip ci]: this change must deploy. The workflow token's push does not start
      # push-triggered workflows, so the search notification is dispatched explicitly.
      - name: Commit and publish newly indexable rule pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/lib/indexed-rules.json
          if git diff --cached --quiet; then echo "No rule pages graduated."; exit 0; fi
          count=$(git diff --cached -U0 src/lib/indexed-rules.json | grep -c '^+ *"slug"' || true)
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Offer ${count} more rule pages for indexing"
          git pull --rebase
          git push
          gh workflow run notify-publish.yml --ref main
  visitors:
    if: inputs.task == 'visitors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - run: npx tsx scripts/visitor-behavior.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
