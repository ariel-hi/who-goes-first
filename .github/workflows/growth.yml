name: Growth automation
# Schedules run only from the default branch. Each job skips itself cleanly
# when its secrets are not configured yet.
on:
  schedule:
    - cron: '17 15 * * *' # daily rule of the day (15:17 UTC)
    - cron: '41 6 * * 1'  # weekly search demand + report (Mondays)
    - cron: '29 11 * * *' # daily Search Console indexing upkeep
  workflow_dispatch:
    inputs:
      task:
        description: Which job to run
        type: choice
        options: [post, weekly, indexing]
        default: weekly
concurrency:
  group: growth-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post:
    if: github.event.schedule == '17 15 * * *' || inputs.task == 'post'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/post-rule.ts
  weekly:
    if: github.event.schedule == '41 6 * * 1' || inputs.task == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'https://whogoesfirst.fun/' }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      # Keyless: GitHub's OIDC token is exchanged for a one-hour Google token.
      # Google only trusts this repository (Workload Identity attribute condition).
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - run: npx tsx scripts/growth-weekly.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      # research/ never deploys; [skip ci] keeps this data commit from
      # triggering a site build on Cloudflare Pages or the CI workflow.
      - name: Commit research queue
        run: |
          git add research/demand
          if git diff --cached --quiet; then echo "No demand changes."; exit 0; fi
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update search demand research queue [skip ci]"
          git pull --rebase
          git push
  indexing:
    if: github.event.schedule == '29 11 * * *' || inputs.task == 'indexing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://whogoesfirst.fun' }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'https://whogoesfirst.fun/' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      # Full webmasters scope so the job can (re)submit sitemaps.
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false
      - run: npx tsx scripts/indexing-daily.ts
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Commit indexing coverage
        if: always()
        run: |
          git add research/demand
          if git diff --cached --quiet; then echo "No indexing changes."; exit 0; fi
          git -c user.name="growth-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update indexing coverage [skip ci]"
          git pull --rebase
          git push
