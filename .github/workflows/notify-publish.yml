name: Notify search after publication
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-search-notification
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://whogoesfirst.fun
      DEPLOY_CONTEXT: production
      # The verified production release immediately before this automation;
      # first-run comparison includes every commit in the audit publication.
      INDEXNOW_INITIAL_BASELINE: 4cdff7c122136db6cac48759d1732d97e06c2f45
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || 'ca-pub-5752718417003865' }}
      ADSENSE_RULE_SLOT: ${{ vars.ADSENSE_RULE_SLOT || '1509819871' }}
      AMAZON_ASSOCIATES_TAG: ${{ vars.AMAZON_ASSOCIATES_TAG || 'whogoesfirstf-20' }}
      CONTACT_EMAIL: edamame.makers@gmail.com
      PRIVACY_HOST_NAME: Cloudflare Pages
      PRIVACY_LOGGING_POLICY: Cloudflare processes IP addresses and request metadata to deliver and protect the site. It retains personal information for periods based on its business purposes and legal obligations, as described in its privacy policy.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify this is the current live production deployment
        id: deployed
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            for (let attempt = 0; attempt < 40; attempt++) {
              const main = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
              if (main.data.sha !== sha) { core.notice('Superseded release; no stale URLs submitted.'); return; }
              const live = await fetch(`https://whogoesfirst.fun/release.json?expected=${sha}`, { cache: 'no-store' });
              if (live.ok && live.headers.get('content-type')?.includes('application/json') && (await live.json()).commit === sha) { core.setOutput('ready', 'true'); return; }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Production deployment unconfirmed; nothing submitted.');
      - uses: actions/setup-node@v4
        if: steps.deployed.outputs.ready == 'true'
        with:
          node-version: '22.23.2'
          cache: npm
      - if: steps.deployed.outputs.ready == 'true'
        run: npm ci
      - uses: actions/cache/restore@v4
        if: steps.deployed.outputs.ready == 'true'
        with:
          path: artifacts/indexnow
          key: indexnow-production-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-v1-
      - name: Build current content and the initial baseline when needed
        if: steps.deployed.outputs.ready == 'true'
        run: |
          BUILD_OUT_DIR=artifacts/publish-after npm run build
          if [ ! -f artifacts/indexnow/published-pages.json ]; then
            git fetch origin "$INDEXNOW_INITIAL_BASELINE" --depth=1
            git worktree add --detach ../publish-before "$INDEXNOW_INITIAL_BASELINE"
            ln -s "$GITHUB_WORKSPACE/node_modules" ../publish-before/node_modules
            cd ../publish-before
            BUILD_OUT_DIR="$GITHUB_WORKSPACE/artifacts/publish-before" npm run build
          fi
      - name: Recheck the production revision after building
        id: current
        if: steps.deployed.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const main = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
            const live = await fetch(`https://whogoesfirst.fun/release.json?expected=${sha}`, { cache: 'no-store' });
            if (main.data.sha === sha && live.ok && (await live.json()).commit === sha) core.setOutput('ready', 'true');
            else core.notice('Superseded during verification; no URLs submitted.');
      - name: Notify only new or materially changed live canonical pages
        id: notify
        if: steps.current.outputs.ready == 'true'
        run: npx tsx scripts/notify-publish.ts artifacts/publish-before artifacts/publish-after --send
      - uses: actions/cache/save@v4
        if: always() && steps.notify.outcome != 'skipped' && steps.deployed.outputs.ready == 'true'
        with:
          path: artifacts/indexnow
          key: indexnow-production-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.deployed.outputs.ready == 'true'
        with:
          name: indexnow-receipts
          path: artifacts/indexnow
          if-no-files-found: ignore
          retention-days: 90
